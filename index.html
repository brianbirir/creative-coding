<html>
<head>
    <title>My Web Page</title>
</head>
<body>
    <canvas id="myCanvas" width="600" height="600" style="border:1px solid #000000;">
    </canvas>
    <script>
        let canvas = document.querySelector("canvas");
        let context = canvas.getContext("2d"); // where the drawing happens

        context.fillStyle = "blue"; // color of the rectangle
        // context.fillRect(100, 100, 400, 400); // x, y, width, height

        context.lineWidth = 5; // width of the stroke
        context.beginPath(); // start a new path
        context.rect(100, 100, 400, 400); // x, y, width, height
        context.stroke(); // draw the path

        context.beginPath(); // start a new path
        context.arc(300, 300, 100, 0, 2 * Math.PI); // x, y, radius, start angle, end angle
        context.stroke();
    </script>
</body>
</html>
