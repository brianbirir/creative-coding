<html>
<head>
    <title>My Web Page</title>
</head>
<body>
    <canvas id="myCanvas" width="600" height="600">
    </canvas>
    <script>
        let canvas = document.querySelector("canvas");
        let context = canvas.getContext("2d"); // where the drawing happens

        //context.fillStyle = "blue"; // color of the rectangle
        // context.fillRect(100, 100, 400, 400); // x, y, width, height

        context.lineWidth = 4; // width of the stroke
        context.beginPath(); // start a new path
        context.rect(100, 100, 400, 400); // x, y, width, height
        // context.stroke(); // draw the path

        context.beginPath(); // start a new path
        context.arc(300, 300, 100, 0, 2 * Math.PI); // x, y, radius, start angle, end angle
        // context.stroke();

        const width = 60;
        const height = 60;
        const gap = 20;
        let x, y;

        for (let i = 0; i < 5; i++) {
            for (let j = 0; j < 5; j++) {
                x = 100 + (width + gap) * i;
                y = 100 + (width + gap) * j;

                // draw outer rectangles
                context.beginPath(); // start a new path
                context.fillStyle = "blue";
                // context.fillRect(x, y, width, height);
                context.rect(x, y, width, height); // x, y, width, height
                context.stroke(); // draw the path

                // draw inner rectangles
                if (Math.random() > 0.5) {
                    context.beginPath(); // start a new path
                    context.fillRect(x + 8, y + 8, width - 16, height - 16);
                    context.rect(x + 8, y + 8, width - 16, height - 16); // x, y, width, height
                    context.stroke(); // draw the path
                }
            }
            
        }
    </script>
</body>
</html>
